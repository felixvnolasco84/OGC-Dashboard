era_Propuesta_Desktop.jpg","mobile":"propuestas/P10_Obra_Requisiciones_Pagina_cabecera_Propuesta_Movil.jpg","comparison":"comparativas/P10_Obra_Requisiciones_Pagina_cabecera_Antes_Despues.jpg"},{"id":"11","module":"Obra","page":"Requisiciones","surface":"Tarjeta · acciones de estado","title":"Distinguir el avance de las acciones que lo modifican","priority":"Media","template":"requisiciones","evidence":["017","018"],"patch":"requisition-row","groups":[["Acciones de esta requisición","Revisar aprobación","Registrar pago","Registrar entrega"],["Consultar","Ver detalles"]],"problem":"Los círculos Por revisar, Pagada y Recibida se parecen a indicadores; no explican claramente que permiten acciones.","proposal":"Conservar el avance como información y reunir sus operaciones con verbos dentro del menú de la tarjeta. Mantener las revisiones y confirmaciones existentes.","benefit":"Hacer explícita la consecuencia de cada acción.","preserve":"Sólo mostrar operaciones permitidas para el rol y estado. No saltar aprobaciones, pagos ni entregas; ninguna selección de la simulación modifica datos.","sources":["src/pages/ProyectoRequisiciones/ProyectoRequisicionesPage.tsx"],"desktop":"propuestas/P11_Obra_Requisiciones_Tarjeta_acciones_de_estado_Propuesta_Desktop.jpg","mobile":"propuestas/P11_Obra_Requisiciones_Tarjeta_acciones_de_estado_Propuesta_Movil.jpg","comparison":"comparativas/P11_Obra_Requisiciones_Tarjeta_acciones_de_estado_Antes_Despues.jpg"},{"id":"12","module":"Obra","page":"RFIs","surface":"Página · filtros de estado y creación rápida","title":"Estados compactos y Continuar con etiqueta visible","priority":"Alta","template":"rfis","evidence":["019","021"],"patch":"rfi-filters","groups":[["Estado","Todas","Abiertas","Vencidas","Borradores","Cerradas"]],"problem":"Seis controles de filtro y la fila de creación rápida exceden el ancho visible; Continuar es sólo un icono.","proposal":"Un selector Estado, el filtro Mi responsabilidad y una acción Nueva RFI. En creación rápid
